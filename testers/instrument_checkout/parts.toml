# Four checkout levels, each needing a different amount of setup.
#
# They're listed shortest-first. Start at BENCH-COMMS: if that doesn't pass,
# nothing above it will, and the problem is the PC talking to the instruments
# rather than anything about measurement.
#
#   BENCH-COMMS     USB only, no leads, no cable
#   BENCH-FG        USB only - proves the FG takes commands
#   BENCH-DMM       test leads and one known resistor
#   BENCH-LOOPBACK  a cable from FG CH1 output to the DMM input
#   BENCH-FULL      all of the above in one run


["BENCH-COMMS"]
desc = "Both instruments answer *IDN? - no cabling needed"
steps = ["SETUP", "DMM_IDENTITY", "FG_IDENTITY", "TEARDOWN"]
result_details = [
    "BENCH_SETUP_READY",
    "BENCH_DMM_RESPONDS",
    "BENCH_DMM_IDN",
    "BENCH_FG_RESPONDS",
    "BENCH_FG_IDN",
    "BENCH_TEARDOWN_SAFE",
]


["BENCH-FG"]
desc = "Function generator takes and echoes back a waveform - no cabling needed"
steps = ["SETUP", "FG_IDENTITY", "FG_PROGRAMMING", "FG_OUTPUT_CONTROL", "TEARDOWN"]
result_details = [
    "BENCH_SETUP_READY",
    "BENCH_FG_RESPONDS",
    "BENCH_FG_IDN",
    "BENCH_FG_ACCEPTS_SETTINGS",
    "BENCH_FG_WAVEFORM_ECHO",
    "BENCH_FG_OUTPUT_TOGGLES",
    "BENCH_TEARDOWN_SAFE",
]


["BENCH-DMM"]
desc = "DMM zero, lead resistance, open circuit and a known resistor"
steps = [
    "SETUP",
    "DMM_IDENTITY",
    "DMM_SHORTED_LEADS",
    "DMM_OPEN_LEADS",
    "DMM_KNOWN_RESISTOR",
    "TEARDOWN",
]
result_details = [
    "BENCH_SETUP_READY",
    "BENCH_DMM_RESPONDS",
    "BENCH_DMM_IDN",
    "BENCH_DMM_SHORTED_V",
    "BENCH_DMM_LEAD_RESISTANCE",
    "BENCH_DMM_OPEN_CIRCUIT",
    "BENCH_DMM_RESISTOR_ERROR",
    "BENCH_TEARDOWN_SAFE",
]


["BENCH-LOOPBACK"]
desc = "FG driven into the DMM: DC sweep, square average, duty, sine RMS, frequency"
steps = [
    "SETUP",
    "DMM_IDENTITY",
    "FG_IDENTITY",
    "LOOPBACK_DC_LEVELS",
    "LOOPBACK_SQUARE_AVERAGE",
    "LOOPBACK_DUTY_CYCLE",
    "LOOPBACK_SINE_RMS",
    "LOOPBACK_FREQUENCY",
    "LOOPBACK_TEARDOWN",
    "TEARDOWN",
]
result_details = [
    "BENCH_SETUP_READY",
    "BENCH_DMM_RESPONDS",
    "BENCH_DMM_IDN",
    "BENCH_FG_RESPONDS",
    "BENCH_FG_IDN",
    "BENCH_LOOPBACK_DC_ERROR",
    "BENCH_LOOPBACK_SQUARE_AVERAGE",
    "BENCH_LOOPBACK_DUTY_AVERAGE",
    "BENCH_LOOPBACK_SINE_RMS",
    "BENCH_LOOPBACK_FREQUENCY_ERROR",
    "BENCH_LOOPBACK_DISCONNECTED",
    "BENCH_TEARDOWN_SAFE",
]


["BENCH-FULL"]
desc = "Everything: comms, FG programming, DMM checks and the full loopback"
steps = [
    "SETUP",
    "DMM_IDENTITY",
    "FG_IDENTITY",
    "FG_PROGRAMMING",
    "FG_OUTPUT_CONTROL",
    "DMM_SHORTED_LEADS",
    "DMM_OPEN_LEADS",
    "DMM_KNOWN_RESISTOR",
    "LOOPBACK_DC_LEVELS",
    "LOOPBACK_SQUARE_AVERAGE",
    "LOOPBACK_DUTY_CYCLE",
    "LOOPBACK_SINE_RMS",
    "LOOPBACK_FREQUENCY",
    "LOOPBACK_TEARDOWN",
    "TEARDOWN",
]
result_details = [
    "BENCH_SETUP_READY",
    "BENCH_DMM_RESPONDS",
    "BENCH_DMM_IDN",
    "BENCH_FG_RESPONDS",
    "BENCH_FG_IDN",
    "BENCH_FG_ACCEPTS_SETTINGS",
    "BENCH_FG_WAVEFORM_ECHO",
    "BENCH_FG_OUTPUT_TOGGLES",
    "BENCH_DMM_SHORTED_V",
    "BENCH_DMM_LEAD_RESISTANCE",
    "BENCH_DMM_OPEN_CIRCUIT",
    "BENCH_DMM_RESISTOR_ERROR",
    "BENCH_LOOPBACK_DC_ERROR",
    "BENCH_LOOPBACK_SQUARE_AVERAGE",
    "BENCH_LOOPBACK_DUTY_AVERAGE",
    "BENCH_LOOPBACK_SINE_RMS",
    "BENCH_LOOPBACK_FREQUENCY_ERROR",
    "BENCH_LOOPBACK_DISCONNECTED",
    "BENCH_TEARDOWN_SAFE",
]
