# Limits for the bench instrument checkout.
#
# The loopback limits are deliberately loose for a first run: they're set to
# catch "something is wrong" rather than to qualify the instruments against
# their datasheets. Once you've run it a few times and seen the real spread,
# tighten them - a limit that never nearly fails isn't testing anything.


# --- Fixture ---------------------------------------------------------------

["BENCH_SETUP_READY"]
validation_type = "boolean"
units = ""
expected_value = true
desc = "Operator confirmed both instruments are powered and connected"

["BENCH_TEARDOWN_SAFE"]
validation_type = "boolean"
units = ""
expected_value = true
desc = "Function generator output switched off at the end of the run"


# --- Communication and identity --------------------------------------------
#
# The two IDN limits only require a plausible-looking string, because the exact
# text depends on your firmware revision. After the first run, look in the log
# for the line "DMM identifies as: ..." and replace the regex below with
# something specific, e.g. "5492B". That turns these from a connectivity check
# into a real identity check, which is what stops someone testing a board with
# the wrong instrument plugged in.

["BENCH_DMM_RESPONDS"]
validation_type = "boolean"
units = ""
expected_value = true
desc = "DMM answered *IDN?"

["BENCH_DMM_IDN"]
validation_type = "regex"
units = ""
expected_value = ".{5,}"
desc = "DMM identity string - tighten to the model number once you've seen it"

["BENCH_FG_RESPONDS"]
validation_type = "boolean"
units = ""
expected_value = true
desc = "Function generator answered *IDN?"

["BENCH_FG_IDN"]
validation_type = "regex"
units = ""
expected_value = ".{5,}"
desc = "FG identity string - tighten to the model number once you've seen it"


# --- Function generator, no cable ------------------------------------------

["BENCH_FG_ACCEPTS_SETTINGS"]
validation_type = "boolean"
units = ""
expected_value = true
desc = "FG accepted a full waveform definition without error"

["BENCH_FG_WAVEFORM_ECHO"]
validation_type = "regex"
units = ""
expected_value = "(?i)squ"
desc = "FG reads back the square wave it was given - proves the command set matches"

["BENCH_FG_OUTPUT_TOGGLES"]
validation_type = "boolean"
units = ""
expected_value = true
desc = "FG accepted output on and output off"


# --- DMM, leads and one resistor -------------------------------------------

["BENCH_DMM_SHORTED_V"]
validation_type = "tolerance"
units = "V"
expected_value = 0.0
tolerance = 0.01
desc = "DC reading with the leads shorted - the meter's zero"

["BENCH_DMM_LEAD_RESISTANCE"]
validation_type = "range"
units = "ohm"
min = 0.0
max = 2.0
desc = "Resistance of the test leads themselves, shorted together"

["BENCH_DMM_OPEN_CIRCUIT"]
validation_type = "boolean"
units = ""
expected_value = true
desc = "Resistance reads over-range with the leads apart"

["BENCH_DMM_RESISTOR_ERROR"]
validation_type = "tolerance"
units = "%"
expected_value = 0.0
tolerance = 10.0
desc = "Error against a resistor the operator identifies - wide, since the resistor's own tolerance is included"


# --- Loopback: FG output into the DMM input --------------------------------

["BENCH_LOOPBACK_DC_ERROR"]
validation_type = "below"
units = "V"
expected_value = 0.1
desc = "Worst disagreement between FG setting and DMM reading across a 0-5V sweep"

["BENCH_LOOPBACK_SQUARE_AVERAGE"]
validation_type = "tolerance"
units = "V"
expected_value = 2.5
tolerance = 0.2
desc = "DC average of a 0-5V square wave at 50% duty"

["BENCH_LOOPBACK_DUTY_AVERAGE"]
validation_type = "tolerance"
units = "V"
expected_value = 1.0
tolerance = 0.2
desc = "DC average of a 0-4V square wave at 25% duty - a duty cycle check without a scope"

["BENCH_LOOPBACK_SINE_RMS"]
validation_type = "tolerance"
units = "V"
expected_value = 0.7071
tolerance = 0.05
desc = "RMS of a 2Vpp sine, which should be the peak divided by root two"

["BENCH_LOOPBACK_FREQUENCY_ERROR"]
validation_type = "below"
units = "%"
expected_value = 1.0
desc = "DMM frequency counter against the FG timebase at 1kHz"

["BENCH_LOOPBACK_DISCONNECTED"]
validation_type = "boolean"
units = ""
expected_value = true
desc = "Operator confirmed the loopback cable was removed"
