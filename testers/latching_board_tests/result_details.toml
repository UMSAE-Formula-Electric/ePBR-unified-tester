# Limits for every measurement this tester can produce.
#
# One entry per result id. The runner validates whatever a step reports against
# the entry with the same name - no pass/fail logic lives in the test code.
#
# validation_type options:
#   range      min <= measured <= max
#   above      measured >= expected_value
#   below      measured <= expected_value
#   tolerance  |measured - expected_value| <= tolerance
#   string     measured == expected_value, exactly
#   regex      expected_value is a regex, searched in the measured string
#   boolean    measured matches expected_value (defaults to true)
#
# `units` is cosmetic - it's appended in logs and stored in the result files.
# `desc` is optional and shows up in the result JSON.


# --- Fixture ---------------------------------------------------------------

["LB_FIXTURE_READY"]
validation_type = "boolean"
units = ""
expected_value = true
desc = "Bench was returned to a safe known state before testing"

["LB_TEARDOWN_SAFE"]
validation_type = "boolean"
units = ""
expected_value = true
desc = "Rails and waveform were switched off after testing"


# --- Power -----------------------------------------------------------------

["LB_QUIESCENT_CURRENT"]
validation_type = "range"
units = "A"
min = 0.001
max = 0.050
desc = "Board current draw at 12V before any load is switched on"

["LB_SUPPLY_VOLTAGE"]
validation_type = "tolerance"
units = "V"
expected_value = 12.0
tolerance = 0.5
desc = "Supply rail measured at the board, not at the PSU terminals"


# --- Firmware --------------------------------------------------------------

["LB_CONSOLE_RESPONDS"]
validation_type = "boolean"
units = ""
expected_value = true
desc = "Serial console answered after power-up"

["LB_FIRMWARE_VERSION"]
validation_type = "regex"
units = ""
expected_value = "^1\\.[0-9]+\\.[0-9]+$"
desc = "Firmware version, any 1.x.y release"


# --- Latch -----------------------------------------------------------------

["LB_COIL_RESISTANCE"]
validation_type = "range"
units = "ohm"
min = 8.0
max = 12.0
desc = "Latch coil resistance - catches an open or shorted winding"

["LB_LATCH_SETS"]
validation_type = "boolean"
units = ""
expected_value = true
desc = "Firmware and the output pin both report the latch set"

["LB_LATCH_CLEARS"]
validation_type = "boolean"
units = ""
expected_value = true
desc = "Firmware and the output pin both report the latch cleared"

["LB_LATCH_OUTPUT_V"]
validation_type = "above"
units = "V"
expected_value = 3.0
desc = "Latch output high level"

["LB_TRIGGER_RESPONDS"]
validation_type = "boolean"
units = ""
expected_value = true
desc = "Latch output follows a 1Hz trigger waveform"

["LB_LATCH_ACTUATE_TIME"]
validation_type = "below"
units = "s"
expected_value = 0.5
desc = "Time from the set command to the output pin going high"

["LB_TRIGGER_THRESHOLD_V"]
validation_type = "range"
units = "V"
min = 1.5
max = 3.5
desc = "DC level at which the trigger input fires"
