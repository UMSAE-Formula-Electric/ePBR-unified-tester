# Which steps run, and which limits apply, for each part number.
#
# Keys are matched as PREFIXES against the part number you pass on the command
# line, longest match wins. So a board called "EPBR27-LB-001-REV-B" matches the
# key "EPBR27-LB-001" below, and you can add a "EPBR27-LB-001-REV-C" key later
# to give a new revision its own step list without disturbing the old one.
#
#   steps           run in the order written; each name must be a decorated
#                   function in tester.py or under tests/
#   result_details  every result id the run is expected to produce; anything
#                   declared here but never measured is recorded as a failure
#
# Check your wiring without touching hardware:
#   python main.py check EPBR27-LB-001


["EPBR27-LB-001"]
desc = "ePBR27 latching board, full functional test"
steps = [
    "SETUP",
    "POWER_ON_CHECK",
    "FIRMWARE_CHECK",
    "COIL_RESISTANCE_TEST",
    "LATCH_SET_CLEAR_TEST",
    "TRIGGER_INPUT_TEST",
    "TRIGGER_THRESHOLD_TEST",
    "TEARDOWN",
]
result_details = [
    "LB_FIXTURE_READY",
    "LB_QUIESCENT_CURRENT",
    "LB_SUPPLY_VOLTAGE",
    "LB_CONSOLE_RESPONDS",
    "LB_FIRMWARE_VERSION",
    "LB_COIL_RESISTANCE",
    "LB_LATCH_SETS",
    "LB_LATCH_CLEARS",
    "LB_LATCH_OUTPUT_V",
    "LB_TRIGGER_RESPONDS",
    "LB_LATCH_ACTUATE_TIME",
    "LB_TRIGGER_THRESHOLD_V",
    "LB_TEARDOWN_SAFE",
]


# A shorter list for bring-up: power and firmware only, no latch actuation.
# Handy on a board you don't trust yet.
["EPBR27-LB-BRINGUP"]
desc = "ePBR27 latching board, power and firmware bring-up only"
steps = [
    "SETUP",
    "POWER_ON_CHECK",
    "FIRMWARE_CHECK",
    "TEARDOWN",
]
result_details = [
    "LB_FIXTURE_READY",
    "LB_QUIESCENT_CURRENT",
    "LB_SUPPLY_VOLTAGE",
    "LB_CONSOLE_RESPONDS",
    "LB_FIRMWARE_VERSION",
    "LB_TEARDOWN_SAFE",
]
